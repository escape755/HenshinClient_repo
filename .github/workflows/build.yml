name: Build Henshin APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Permisos de gradlew
        run: chmod +x gradlew

      - name: Compilar APK debug
        id: build
        run: ./gradlew assembleDebug

      - name: Resumen de errores
        if: failure()
        run: |
          {
            echo "## Errores de compilación"
            echo ""
            echo '```'
            grep -E "^e: |What went wrong|FAILED" build_log.txt 2>/dev/null || echo "Revisa el log del paso 'Compilar APK debug'."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: HenshinClient-debug
          path: app/build/outputs/apk/debug/*.apk
